name: CI

on:
  push:
    branches: [main, beta]
    paths-ignore: ['**.md', 'public/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_OPTIONS: --max-old-space-size=14384
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node
        with:
          electron-install: false
          full-cache: true
      - run: yarn nota @nota/i18n build
      - run: yarn typecheck

  unit-test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node
        with:
          electron-install: false
          full-cache: true
      - run: yarn nota @nota/i18n build
      - run: yarn vitest --run packages/frontend/apps/electron/test/main packages/frontend/core/src/modules/google-auth

  # Builds the desktop renderer the same way the release workflow does, so a
  # broken bundle fails the PR instead of the release. Runs on main too, which
  # keeps the rspack cache warm for release builds (caches saved on the default
  # branch are readable from tag and dispatch runs).
  build-renderer:
    name: Build renderer
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node
        with:
          electron-install: false
      - uses: ./.github/actions/rspack-cache
      - run: yarn nota @nota/i18n build
      - run: yarn nota @nota/electron-renderer build

  ci-passed:
    name: CI passed
    needs: [typecheck, unit-test, build-renderer]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: exit 1
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
