name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Branch release version: X.Y.Z-beta.N (beta) or X.Y.Z (main). Leave empty when dispatching a version tag.'
        type: string
        required: false
        default: ''

# Serialize tagged and branch-dispatched versions together. Never cancel an
# active publisher or let two refs race to create the same release.
concurrency:
  group: release-desktop
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  actions: write
  id-token: write
  packages: write
  security-events: write
  attestations: write
  issues: write

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      APP_VERSION: ${{ steps.prepare.outputs.APP_VERSION }}
      GIT_SHORT_HASH: ${{ steps.prepare.outputs.GIT_SHORT_HASH }}
      BUILD_TYPE: ${{ steps.prepare.outputs.BUILD_TYPE }}
    steps:
      - uses: actions/checkout@v7
      - name: Prepare Release
        id: prepare
        uses: ./.github/actions/prepare-release
        with:
          version: ${{ inputs.version }}
      - name: Protect published versions
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.prepare.outputs.APP_VERSION }}
        run: bash scripts/check-release-version.sh

  desktop:
    name: Release Desktop
    needs: prepare
    uses: ./.github/workflows/release-desktop.yml
    secrets: inherit
    with:
      build-type: ${{ needs.prepare.outputs.BUILD_TYPE }}
      app-version: ${{ needs.prepare.outputs.APP_VERSION }}
      git-short-hash: ${{ needs.prepare.outputs.GIT_SHORT_HASH }}
      desktop_macos: true
      desktop_windows: true
      desktop_linux: true
