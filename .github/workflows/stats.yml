name: Download stats

# Records GitHub release download counts once a day on the `stats` branch.
# `.dmg` downloads are fresh installs; `.zip` downloads are auto-updates.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stats

jobs:
  record:
    if: github.repository == 'madcodeorg/nota'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Record counts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          releases=$(gh api --paginate "repos/${{ github.repository }}/releases?per_page=100" | jq -s 'add')
          sum() { echo "$releases" | jq "[.[] | select(.draft == false) | .assets[] | select(.name | test(\"$1\")) | .download_count] | add // 0"; }
          installs=$(sum '\\.dmg$')
          updates=$(sum '\\.zip$')
          today=$(date -u +%F)
          git fetch origin stats || true
          if git rev-parse --verify origin/stats >/dev/null 2>&1; then
            git checkout -B stats origin/stats
          else
            git checkout --orphan stats
            git rm -rf . >/dev/null
            printf '# Nota download stats\n\nCumulative GitHub release downloads. Installs are .dmg files; updates are .zip files.\n\n| Date (UTC) | Installs | Updates |\n| --- | ---: | ---: |\n' > STATS.md
          fi
          if ! grep -q "^| $today " STATS.md; then
            echo "| $today | $installs | $updates |" >> STATS.md
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add STATS.md
          git commit -m "stats: $today" || exit 0
          git push origin stats
