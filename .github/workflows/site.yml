name: Site

# Deploys thenota.app to GitHub Pages. The page comes from public/, and the
# update manifest and download page come from the latest published release,
# so publishing a release is all it takes to ship an update.
on:
  release:
    types: [published, edited]
  push:
    branches: [main]
    paths: ['public/**', '.github/workflows/site.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Release events default to the release tag, which can predate current site copy.
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Build site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p _site
          cp -R public/. _site/
          cp _site/launch.html _site/index.html
          echo "thenota.app" > _site/CNAME
          touch _site/.nojekyll

          gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate --jq '.[] | select(.draft | not)' |
            jq -s '.' > "$RUNNER_TEMP/site-releases.json"
          bash scripts/site-release-feeds.sh stable
          TAG="$(jq -r 'map(select(.prerelease | not)) | sort_by(.published_at) | reverse | .[0].tag_name // empty' "$RUNNER_TEMP/site-releases.json")"
          if [ -n "$TAG" ]; then
            VERSION="${TAG#v}"
            sed -i "s#\(data-nota-version[^>]*>\)[0-9][0-9.]*#\1${VERSION}#" _site/index.html
            echo "Site will ship ${TAG}"
          fi

          # Every published release, for the download and beta pages.
          jq 'map({
              tag: .tag_name,
              version: (.tag_name | ltrimstr("v")),
              prerelease: .prerelease,
              date: .published_at,
              notes: (.body // ""),
              url: .html_url,
              assets: [.assets[] | select(.name | test("^nota-.+-(macos|windows|linux)-(arm64|x64)\\.")) | {
                name: .name,
                size: .size,
                sha256: ((.digest // "") | ltrimstr("sha256:")),
                url: .browser_download_url
              }]
            })' "$RUNNER_TEMP/site-releases.json" > _site/releases.json
          echo "releases.json lists $(jq length _site/releases.json) releases"

      - name: Add beta update channel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash scripts/site-release-feeds.sh beta

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
