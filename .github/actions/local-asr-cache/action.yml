name: 'Local ASR build cache'
description: >-
  Cache the whisper.cpp / llama.cpp build tree (several minutes, ~400 MB). Used
  by both the release build and the cache-warming workflow so they share keys.

inputs:
  platform:
    description: 'win32, darwin or linux'
    required: true
  arch:
    description: 'x64 or arm64'
    required: true

runs:
  using: 'composite'
  steps:
    # Both helpers are pinned by commit in build-local-asr.ts, so the build tree
    # stays valid until that script or the helper sources change; cmake then
    # only rebuilds what changed. On Windows the tree lives at C:\nvk
    # (NOTA_LOCAL_ASR_BUILD_ROOT) to stay under MAX_PATH.
    - name: Identify Linux build baseline
      if: ${{ inputs.platform == 'linux' }}
      id: baseline
      shell: bash
      run: |
        . /etc/os-release
        echo "suffix=-${ID}-${VERSION_ID}-gcc11" >> "$GITHUB_OUTPUT"

    - name: Cache local ASR build tree
      uses: actions/cache@v5
      with:
        path: ${{ inputs.platform == 'win32' && 'C:\nvk' || 'packages/frontend/apps/electron/native/local-asr-helper/.build' }}
        key: local-asr-${{ inputs.platform }}-${{ inputs.arch }}${{ steps.baseline.outputs.suffix }}-${{ hashFiles('packages/frontend/apps/electron/scripts/build-local-asr.ts', 'packages/frontend/apps/electron/native/local-asr-helper/**') }}
        restore-keys: |
          local-asr-${{ inputs.platform }}-${{ inputs.arch }}${{ steps.baseline.outputs.suffix }}-
